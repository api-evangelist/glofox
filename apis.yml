name: Glofox
kind: company
description: Glofox is boutique gym and fitness studio management software -
  member management, class/appointment scheduling, bookings, memberships,
  credits, payments, and lead conversion for studios, gyms, and fitness
  franchises. Glofox was acquired by ABC Fitness Solutions in August 2022 and
  now operates as the ABC Glofox business unit within ABC's fitness technology
  platform. Glofox publishes a partner/developer REST API (the "ABC Glofox API
  Developer Portal") covering members, memberships, plans, credits, classes,
  bookings, purchases, branches, and leads, plus CDC (change data capture)
  webhooks for member and access-control events. Access is gated - integrators
  request x-api-key and x-glofox-api-token credentials by email before they can
  call the API.
