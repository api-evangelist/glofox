  properties:
  - url: https://apidocs-plat.aws.glofox.com/cdc-webhooks/
    type: Documentation
  description: Outbound change-data-capture webhooks - an HMAC-SHA256-signed
    Member Webhook (MEMBER_CREATED, MEMBER_UPDATED; deletes are soft via an
    active flag, no MEMBER_DELETED event) and an Access Webhook that keeps
    barcode identifiers in sync with access-control hardware. Delivery is
    at-least-once HTTP POST with a 5-second response timeout and up to three
    attempts.
