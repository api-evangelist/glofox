description: >-
  FinOps view of Glofox/ABC Glofox spend. Glofox is sold as a per-studio SaaS
  subscription (not usage-metered API billing) - cost scales with the number
  of locations, staff seats, and member volume, plus optional add-ons such as
  a branded mobile app, marketing automation, and payment processing fees on
  member transactions. API access (x-api-key / x-glofox-api-token) is bundled
  into the software subscription for existing customers/partners rather than
  billed separately per request, so the API itself has no distinct meter -
  the underlying software plan and any payment-processing take-rate are the
  cost drivers to track.
notes: >-
  Exact subscription tiers and payment-processing rates are not published by
  Glofox and require a sales quote; treat the figures in plans/ as
  third-party estimates pending reconciliation with Glofox/ABC Fitness
  directly.
