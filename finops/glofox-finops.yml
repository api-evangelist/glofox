meters:
- name: location_subscription
  description: Monthly per-location software subscription fee.
  unit: locations
  aggregation: sum
  dimensions:
  - account
  - location
- name: staff_seats
  description: Additional staff-seat charges above a plan's included allotment.
  unit: seats
  aggregation: sum
  dimensions:
  - account
  - location
- name: payment_processing
  description: Transaction fees on member payments processed via the Payment
    Collector flow.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - location
- name: add_ons
  description: Optional add-on charges (branded mobile app, marketing
    automation, premium integrations/API access).
  unit: subscriptions
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track per-location subscription tier, staff-seat count, and
    payment-processing volume monthly; Glofox does not expose usage-based API
    billing to reconcile separately.
- name: Allocation
  description: Map each Glofox location/branch (x-glofox-branch-id) to an
    internal cost center for multi-location operators and franchises.
- name: Optimization
  description: Right-size staff seats and add-ons per location; consolidate
    payment processing through Glofox's own Payment Collector to avoid
    third-party gateway fees stacking on top of the subscription.
- name: Accountability
  description: Assign an owner per location/franchise contract and review
    subscription tier and add-on spend at renewal against actual member and
    booking volume.
